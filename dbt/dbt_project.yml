name: retail_intelligence
version: "1.0.0"
profile: retail_intelligence

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Databricks only: create the Python functions the fuzzy title match needs (no-op on DuckDB)
on-run-start:
  - "{{ create_cross_engine_udfs() }}"

vars:
  raw_dir: "{{ env_var('RI_RAW_DIR', 'data/raw') }}"   # set by run.py; default relative to the repo root
  data_start: "2026-01-01"      # sales dated before this are typing errors
  max_units_per_line: 20        # a sales line with more units (or returns) than this is a typing error
  max_price_age_days: 7         # a competitor price older than this is not used
  max_fx_age_days: 5            # an FX rate carried forward longer than this is not used
  # tests that compare the pipeline with the defects the generator injected;
  # run with --vars '{simulation: false}' on real client data
  simulation: true

models:
  retail_intelligence:
    +materialized: table
    silver:
      +schema: silver
    gold:
      +schema: gold

seeds:
  retail_intelligence:
    +schema: reference

data_tests:
  retail_intelligence:
    +severity: error
