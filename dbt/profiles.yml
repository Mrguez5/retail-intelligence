retail_intelligence:
  target: local
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('RI_DB_PATH', 'data/warehouse/retail.duckdb') }}"   # set by run.py; default relative to the repo root
      threads: 4

    # Same models on Databricks (Unity Catalog, Delta tables): dbt ... --target databricks
    # Needs the dbt-databricks adapter (Python 3.11-3.13) and three environment variables;
    # nothing secret is stored in this file.
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', 'not-set') }}"            # e.g. dbc-xxxx.cloud.databricks.com
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', 'not-set') }}"  # SQL warehouse > Connection details
      token: "{{ env_var('DATABRICKS_TOKEN', 'not-set') }}"          # personal access token
      catalog: "{{ env_var('RI_DATABRICKS_CATALOG', 'workspace') }}"
      schema: retail_intelligence
      threads: 4
