version: 2

models:
  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: dim_product
    description: Products with supplier and the competitor page that sells the same book.
    columns:
      - name: sku
        data_tests: [unique, not_null]

  - name: dim_supplier
    columns:
      - name: supplier_code
        data_tests: [unique, not_null]

  - name: dim_channel
    columns:
      - name: channel
        data_tests: [unique, not_null]

  - name: fct_sales
    description: One row per sales line with revenue, standard cost and margin.
    columns:
      - name: sale_line_id
        data_tests: [unique, not_null]
      - name: sale_date
        data_tests:
          - relationships: {arguments: {to: ref('dim_date'), field: date_day}}
      - name: sku
        data_tests:
          - relationships: {arguments: {to: ref('dim_product'), field: sku}}
      - name: channel
        data_tests:
          - relationships: {arguments: {to: ref('dim_channel'), field: channel}}
      - name: unit_cost_eur
        data_tests: [not_null]

  - name: fct_competitor_price_daily
    description: Competitor price per product and day (ASOF join to the latest observation), in GBP and EUR.
    data_tests:
      - unique_combination:
          arguments:
            columns: [date_day, sku]

  - name: mart_price_position_weekly
    description: Inkwell's average price vs the competitor's, per product and week.
    data_tests:
      - unique_combination:
          arguments:
            columns: [week_start, sku]
    columns:
      - name: price_band
        data_tests:
          - accepted_values:
              arguments:
                values: [no sales, cheaper, aligned, pricier, much pricier]

  - name: mart_invoice_audit
    description: Supplier invoices checked for arithmetic, duplicates and prices above contract.
    columns:
      - name: source_file
        data_tests: [unique, not_null]
      - name: audit_status
        data_tests:
          - accepted_values:
              arguments:
                values: [OK, BLOCK - duplicate, REVIEW - total does not add up,
                         CLAIM - billed above contract, REVIEW - no contract price]

  - name: mart_kpis_monthly
    columns:
      - name: month_start
        data_tests: [unique, not_null]

  - name: mart_data_quality
    description: Every data-quality check with rows checked, rows failed and the action taken.
