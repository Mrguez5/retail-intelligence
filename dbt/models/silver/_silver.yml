version: 2

models:
  - name: silver_products
    description: Inkwell's catalogue from the ERP export.
    columns:
      - name: sku
        data_tests: [unique, not_null]
      - name: title_key
        data_tests: [unique, not_null]
      - name: supplier_code
        data_tests:
          - relationships: {arguments: {to: ref('suppliers'), field: supplier_code}}
      - name: list_price_eur
        data_tests: [not_null]

  - name: silver_contract_prices
    description: Supplier contract prices, one row per validity period (type-2 history).
    columns:
      - name: sku
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('silver_products'), field: sku}}
      - name: unit_cost_eur
        data_tests: [not_null]
      - name: valid_from
        data_tests: [not_null]

  - name: silver_fx_daily
    description: EUR/GBP for every calendar day; weekends carry the last business-day rate.
    columns:
      - name: rate_date
        data_tests: [unique, not_null]
      - name: eur_gbp
        data_tests: [not_null]

  - name: silver_competitor_runs
    columns:
      - name: source_file
        data_tests: [unique, not_null]

  - name: silver_competitor_prices
    description: Every competitor observation with a per-row data-quality verdict.
    columns:
      - name: url
        data_tests: [not_null]
      - name: dq_issue
        data_tests:
          - accepted_values:
              arguments:
                values: [invalid_timestamp, price_not_numeric, price_zero_or_negative, price_outlier]

  - name: silver_competitor_price_history
    description: Type-2 history of competitor prices (gaps-and-islands).
    columns:
      - name: price_gbp
        data_tests: [not_null]

  - name: silver_product_competitor_link
    columns:
      - name: sku
        data_tests: [unique, not_null]
      - name: link_method
        data_tests:
          - accepted_values:
              arguments:
                values: [erp_link, title_match, ambiguous_title, not_found]

  - name: silver_sales
    description: Clean, de-duplicated sales lines from the three channels.
    columns:
      - name: sale_line_id
        data_tests: [unique, not_null]
      - name: sku
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('silver_products'), field: sku}}
      - name: channel
        data_tests:
          - relationships: {arguments: {to: ref('channels'), field: channel}}
      - name: sold_at
        data_tests: [not_null]
      - name: quantity
        data_tests: [not_null]
      - name: match_method
        data_tests:
          - accepted_values:
              arguments:
                values: [sku, title_exact, title_fuzzy]

  - name: silver_sales_quarantine
    description: Sales lines kept out of the analysis, with the reason.
    columns:
      - name: sale_line_id
        data_tests: [unique, not_null]
      - name: dq_issue
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [duplicate_line, invalid_date, unknown_product, missing_quantity,
                         zero_quantity, invalid_price, price_outlier]

  - name: silver_invoice_headers
    columns:
      - name: source_file
        data_tests: [unique, not_null]
      - name: supplier_code
        data_tests: [not_null]
      - name: invoice_date
        data_tests: [not_null]
      - name: total_printed
        data_tests: [not_null]

  - name: silver_invoice_lines
    columns:
      - name: sku
        data_tests:
          - relationships: {arguments: {to: ref('silver_products'), field: sku}}
      - name: unit_price_billed
        data_tests: [not_null]
      - name: unit_price_contract
        data_tests: [not_null]
